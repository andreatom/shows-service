server:
  port: 8081
spring:
  application:
    name: shows-service
  datasource:
    url: ${SHOWS_DB_URL:jdbc:postgresql://localhost:5432/shows_db}
    username: ${SHOWS_DB_USER:cinema}
    password: ${SHOWS_DB_PASSWORD:cinema}
  jpa:
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
            loggerLevel: basic
springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: DEBUG
    it.its.cinema.shows_service.client: ${FEIGN_LOG_LEVEL:INFO}

cinema:
  catalog-file: classpath:catalog.json

  catalog:
    remote-url: ${CINEMA_CATALOG_REMOTE_URL:http://localhost:8090}
---
spring:
  config:
    activate:
      on-profile: docker
logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
