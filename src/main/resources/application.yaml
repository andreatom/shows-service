server:
  port: 8081
spring:
  application:
    name: shows-service
  datasource:
    url: ${SHOWS_DB_URL:jdbc:postgresql://localhost:5432/shows_db}
    username: ${SHOWS_DB_USER:cinema}
    password: ${SHOWS_DB_PASSWORD:cinema}
  jpa:
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: DEBUG
