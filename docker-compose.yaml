services:
  shows_db:
    image: postgres:17-alpine
    container_name: shows_db
    environment:
        POSTGRES_DB: ${SHOWS_DB_NAME:-shows_db}
        POSTGRES_USER: ${SHOWS_DB_USER:-cinema}
        POSTGRES_PASSWORD: ${SHOWS_DB_PASSWORD:-cinema}
    ports:
      - "${SHOWS_DB_PORT:-5432}:5432"
    volumes:
      - shows_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHOWS_DB_USER:-cinema} -d ${SHOWS_DB_NAME:-shows_db}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
  shows-service:
    build: .
    image: cinema/shows-service:1.0
    container_name: shows-service
    ports:
      - "${SHOWS_SERVICE_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SHOWS_DB_URL: jdbc:postgresql://shows_db:5432/${SHOWS_DB_NAME:-shows_db}
      SHOWS_DB_USER: ${SHOWS_DB_USER:-cinema}
      SHOWS_DB_PASSWORD: ${SHOWS_DB_PASSWORD:-cinema}
    depends_on:
      shows_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -0- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    deploy:
        resources:
          limits:
            memory: 512M
volumes:
  shows_pgdata:

  
